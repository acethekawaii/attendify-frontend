<main>
<section class="hero-wash">
  <div
    class="main-container grid items-center gap-12 py-16 md:py-24 lg:grid-cols-2 lg:gap-16"
  >
    <div class="reveal max-w-xl">
      <span
        class="inline-flex items-center gap-2 rounded-full bg-monochromatic-light px-3 py-1 text-sm font-semibold text-primary-action"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-monochromatic-dark" aria-hidden="true"></span>
        Version 2.0 Now Available
      </span>

      <h1 class="hero-title mt-5 text-balance font-bold text-text-900">
        Church attendance, without the clipboard.
      </h1>

      <p class="mt-5 text-pretty text-lg text-text-300">{{ description }}</p>

      <div class="mt-8 flex flex-wrap gap-3">
        <a
          routerLink="/about"
          class="inline-flex items-center justify-center rounded-md bg-primary-action px-5 py-2.5 font-semibold text-white transition-colors hover:bg-primary-action-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-monochromatic-dark"
        >
          See how it works
        </a>
        <a
          routerLink="/login"
          class="inline-flex items-center justify-center rounded-md border border-line-strong bg-white px-5 py-2.5 font-semibold text-primary-action transition-colors hover:border-monochromatic-dark hover:bg-monochromatic-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-monochromatic-dark"
        >
          Log in
        </a>
      </div>
    </div>

    <div class="reveal reveal-delay">
      <figure class="media-frame">
        <img
          ngSrc="/assets/example/sunday-service-trends.svg"
          width="1100"
          height="620"
          priority
          sizes="(max-width: 1024px) 92vw, 46vw"
          alt="Attendance Trends - Sunday Service. Attendees from September 20 to November 8, 2026: 181, 285, 275, 261, 244, 252, 199, 226. VIP Attendees: 26, 74, 76, 75, 67, 56, 42, 62."
        />
      </figure>
    </div>
  </div>
</section>

<section class="main-container -mt-2">
  <div class="overflow-hidden rounded-2xl border border-line bg-white">
    <div class="grid grid-cols-1 divide-y divide-line sm:grid-cols-3 sm:divide-x sm:divide-y-0">
      @for (stat of stats; track stat.label) {
        <div class="px-6 py-7 text-center">
          <p class="text-4xl font-bold tabular-nums text-text-900 md:text-5xl">{{ stat.value }}</p>
          <p class="mt-1 text-sm text-text-300">{{ stat.label }}</p>
        </div>
      }
    </div>

    <div
      class="flex flex-col items-center justify-between gap-4 border-t border-line bg-surface-muted px-6 py-5 sm:flex-row"
    >
      <p class="text-sm text-text-300">
        Trusted by
        <a
          href="https://www.facebook.com/lthmrectomanila"
          target="_blank"
          rel="noopener"
          class="font-semibold text-primary-action hover:underline"
          >Life Transform Harvest Ministry International</a
        >
        since 2024.
      </p>
      <app-trustbox class="w-full sm:w-auto sm:min-w-[240px]"></app-trustbox>
    </div>
  </div>
</section>

<section class="main-container py-16 md:py-24">
  <div class="text-center">
    <h2
      class="section-pill inline-flex items-center rounded-full bg-surface-muted px-3 py-1 text-sm font-semibold"
    >
      What's New in Version 2.0
    </h2>
  </div>

  <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
    <app-feature-card
      type="New"
      icon="flip"
      title="Face Recognition Check-in"
      description="Seamless, contactless attendance with facial recognition technology."
    ></app-feature-card>

    <app-feature-card
      type="Enhanced"
      icon="assignment"
      title="Automated Reporting"
      description="Generate comprehensive attendance reports with a single click."
    ></app-feature-card>

    <app-feature-card
      type="Enhanced"
      icon="rocket"
      title="Overall Performance"
      description="No more waiting. Say goodbye to a minute long loading screen."
    ></app-feature-card>

    <app-feature-card
      type="Enhanced"
      icon="brush"
      title="Slick New Look & Feel!"
      description="A fresh, friendly design. We polished the entire app from the ground up."
    ></app-feature-card>
  </div>
</section>
</main>
